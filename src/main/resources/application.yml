spring:
  application:
    name: netflix-dgs-practice
  graphql:
    graphiql:
      enabled: true      # in-browser IDE at /graphiql
    schema:
      printer:
        enabled: true    # dumps the stitched schema at /graphql/schema
      inspection:
        enabled: true    # logs schema fields that have no datafetcher
  datasource:
    url: jdbc:h2:mem:dgsdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

logging:
  level:
    com.example.dgspractice: DEBUG
